<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Oxigênio · Wellhub Auto Check-in</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 14px; width: 320px; background: #f8fafc; color: #0f172a; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 8px 0 3px; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;
    }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; }
    .row label { margin: 0; font-weight: 500; cursor: pointer; }
    button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 7px; background: #0f766e; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #115e59; }
    .status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #fff; border: 1px solid #e2e8f0; font-size: 12px; }
    .err { color: #b91c1c; }
    ul { margin: 6px 0 0; padding-left: 16px; }
  </style>
</head>
<body>
  <h1>Oxigênio · Wellhub Auto Check-in</h1>
  <div class="row">
    <input type="checkbox" id="enabled" />
    <label for="enabled">Vigia automática ativa</label>
  </div>
  <div class="row">
    <input type="checkbox" id="autoConfirm" />
    <label for="autoConfirm">Confirmar "Check-ins para confirmar" sozinho</label>
  </div>
  <label for="apiUrl">URL do sistema</label>
  <input type="text" id="apiUrl" placeholder="https://sistema.academiaoxigenio.com" />
  <label for="username">Usuário da recepção (opcional se já logado)</label>
  <input type="text" id="username" placeholder="admin" />
  <label for="password">Senha (opcional se já logado)</label>
  <input type="password" id="password" placeholder="••••••" />
  <label for="refreshSeconds">Atualizar lista a cada (segundos)</label>
  <input type="number" id="refreshSeconds" min="4" max="60" value="8" />
  <button id="saveBtn">Salvar configurações</button>
  <div id="statusBox" class="status">Aguardando sincronização...</div>
  <script src="popup.js"></script>
</body>
</html>
